databases:
  - name: invoice-agent-db
    databaseName: invoice_agent
    user: invoice_user
    plan: standard

services:
  - type: web
    name: a2a-invoice-agent
    env: python
    plan: standard
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-agent-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
